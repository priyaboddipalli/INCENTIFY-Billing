<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INCENTIFY ERP — Admin</title><style>:root{--n:#083866;--b:#0c4b7c;--bg:#f5f8fb;--line:#d4e0ea;--mut:#63778a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#132333}header{height:58px;background:#062a4b;color:white;display:flex;align-items:center;padding:0 22px;gap:12px}header img{width:38px;height:34px;object-fit:contain;background:#fff;border-radius:6px}header .grow{flex:1}button{border:0;border-radius:8px;padding:8px 11px;cursor:pointer}.ghost{background:rgba(255,255,255,.12);color:#fff}.wrap{max-width:1300px;margin:auto;padding:22px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 20px rgba(8,56,102,.06)}.card{padding:16px}.k{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--mut)}.v{font-size:25px;font-weight:800;color:var(--n);margin-top:5px}.tabs{display:flex;gap:7px;margin:20px 0}.tabs button{background:#eaf2f8;color:var(--n);font-weight:700}.tabs button.active{background:var(--n);color:#fff}.panel{padding:16px}.view{display:none}.view.active{display:block}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid #e8eef3;vertical-align:top}th{font-size:10px;text-transform:uppercase;color:var(--mut)}input,select{padding:9px;border:1px solid var(--line);border-radius:7px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.primary{background:var(--n);color:#fff}.mini{background:#eaf2f8;color:var(--n)}.danger{background:#fdf0ee;color:#b42318}.status{padding:3px 7px;border-radius:12px;background:#eef4f8;font-size:10px}.online{background:#e7f7ee;color:#166534}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}table{display:block;overflow:auto}}</style></head><body><header><img src="assets/INCENTIFY_app_mark.png"><div><strong>INCENTIFY ERP Admin</strong><div style="font-size:10px;color:#b8cde0">Users · Sessions · Login history · Audit · Issues</div></div><div class="grow"></div><button class="ghost" onclick="location.href='erp.html'">ERP</button><button class="ghost" id="logout">Logout</button></header><main class="wrap"><section class="cards"><div class="card"><div class="k">Version</div><div class="v" id="s-ver">—</div></div><div class="card"><div class="k">Active users</div><div class="v" id="s-users">—</div></div><div class="card"><div class="k">Active sessions</div><div class="v" id="s-sessions">—</div></div><div class="card"><div class="k">Open issues</div><div class="v" id="s-issues">—</div></div><div class="card"><div class="k">DB revision</div><div class="v" id="s-rev">—</div></div></section><nav class="tabs"><button data-tab="users" class="active">Users</button><button data-tab="sessions">Sessions</button><button data-tab="login">Login History</button><button data-tab="audit">Audit Log</button><button data-tab="issues">Issues</button></nav><section class="panel"><div id="users" class="view active"><div class="row"><input id="u-email" placeholder="email@company.com" style="min-width:240px"><input id="u-name" placeholder="Name"><select id="u-role"><option>VIEWER</option><option>SALES</option><option>ACCOUNTS</option><option>DIRECTOR</option><option>ADMIN</option></select><button class="primary" id="u-save">Add / Update</button></div><div id="users-table"></div></div><div id="sessions" class="view"><div id="sessions-table"></div></div><div id="login" class="view"><div id="login-table"></div></div><div id="audit" class="view"><div id="audit-table"></div></div><div id="issues" class="view"><div class="row"><button class="primary" id="backup">Create Cloud Backup</button><span id="backup-msg"></span></div><div id="issues-table"></div></div></section></main><script src="js/config.js"></script><script src="js/bridge-client.js"></script><script src="js/auth.js"></script><script>
(async()=>{const A=incentifyApi,Auth=IncentifyAuth;let token=Auth.token();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));await Auth.requireAdmin();document.getElementById('logout').onclick=()=>Auth.logout();async function call(action,p={}){return A.call(action,{token,...p},60000)}async function status(){const s=await call('systemStatus');document.getElementById('s-ver').textContent=s.version;document.getElementById('s-users').textContent=s.users;document.getElementById('s-sessions').textContent=s.activeSessions;document.getElementById('s-issues').textContent=s.openIssues;document.getElementById('s-rev').textContent=s.revision}async function users(){const r=await call('adminListUsers');document.getElementById('users-table').innerHTML='<table><tr><th>Email</th><th>Name</th><th>Role</th><th>Status</th><th></th></tr>'+(r.users||[]).map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td>${esc(u.status)}</td><td><button class="mini toggle" data-email="${esc(u.email)}" data-status="${u.status==='ACTIVE'?'DISABLED':'ACTIVE'}">${u.status==='ACTIVE'?'Disable':'Enable'}</button></td></tr>`).join('')+'</table>';document.querySelectorAll('.toggle').forEach(b=>b.onclick=async()=>{await call('adminSetUserStatus',{email:b.dataset.email,status:b.dataset.status});await users();await status()})}async function sessions(){const r=await call('adminListSessions',{limit:200});document.getElementById('sessions-table').innerHTML='<table><tr><th>User</th><th>Role</th><th>Created</th><th>Last seen</th><th>Status</th><th></th></tr>'+(r.sessions||[]).map(s=>`<tr><td>${esc(s.email)}</td><td>${esc(s.role)}</td><td>${esc(s.createdAt)}</td><td>${esc(s.lastSeenAt)}</td><td><span class="status ${s.online?'online':''}">${s.online?'ONLINE':esc(s.status)}</span></td><td>${s.status==='ACTIVE'?`<button class="danger kick" data-hash="${esc(s.sessionHash)}">Force logout</button>`:''}</td></tr>`).join('')+'</table>';document.querySelectorAll('.kick').forEach(b=>b.onclick=async()=>{await call('adminForceLogout',{sessionHash:b.dataset.hash});await sessions();await status()})}async function login(){const r=await call('adminLoginHistory',{limit:300});document.getElementById('login-table').innerHTML='<table><tr><th>Time</th><th>Email</th><th>Event</th><th>Status</th><th>Message</th></tr>'+(r.events||[]).map(x=>`<tr><td>${esc(x.TIMESTAMP)}</td><td>${esc(x.EMAIL)}</td><td>${esc(x.EVENT)}</td><td>${esc(x.STATUS)}</td><td>${esc(x.MESSAGE)}</td></tr>`).join('')+'</table>'}async function audit(){const r=await call('adminAudit',{limit:300});document.getElementById('audit-table').innerHTML='<table><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>Status</th><th>Message</th></tr>'+(r.events||[]).map(x=>`<tr><td>${esc(x.TIMESTAMP)}</td><td>${esc(x.EMAIL)}</td><td>${esc(x.ACTION)}</td><td>${esc(x.ENTITY)} ${esc(x.ENTITY_ID)}</td><td>${esc(x.STATUS)}</td><td>${esc(x.MESSAGE)}</td></tr>`).join('')+'</table>'}async function issues(){const r=await call('adminIssues',{limit:200});document.getElementById('issues-table').innerHTML='<table><tr><th>Time</th><th>Severity</th><th>Source</th><th>Message</th><th>Status</th><th></th></tr>'+(r.issues||[]).map(x=>`<tr><td>${esc(x.TIMESTAMP)}</td><td>${esc(x.SEVERITY)}</td><td>${esc(x.SOURCE)}</td><td>${esc(x.MESSAGE)}</td><td>${esc(x.STATUS)}</td><td>${x.STATUS==='OPEN'?`<button class="mini resolve" data-id="${esc(x.ISSUE_ID)}">Resolve</button>`:''}</td></tr>`).join('')+'</table>';document.querySelectorAll('.resolve').forEach(b=>b.onclick=async()=>{await call('adminResolveIssue',{issueId:b.dataset.id});await issues();await status()})}document.getElementById('u-save').onclick=async()=>{await call('adminUpsertUser',{user:{email:document.getElementById('u-email').value.trim(),name:document.getElementById('u-name').value.trim(),role:document.getElementById('u-role').value,status:'ACTIVE'}});document.getElementById('u-email').value='';document.getElementById('u-name').value='';await users();await status()};document.getElementById('backup').onclick=async()=>{const m=document.getElementById('backup-msg');m.textContent='Creating…';try{const r=await call('createBackup');m.textContent='Created '+(r.backup?.fileName||'backup')}catch(e){m.textContent=e.message}};const loaders={users,sessions,login,audit,issues};document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.tab).classList.add('active');await loaders[b.dataset.tab]()});await status();await users()})().catch(e=>{console.error(e);alert(e.message)});
</script></body></html>
